[project]
name = "ssl-tls-validator"
version = "1.0.0"
description = "A professional and secure SSL/TLS Configuration Validator"
authors = [
    { name = "Braulio" }
]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N"]
ignore = ["E501", "N818"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
